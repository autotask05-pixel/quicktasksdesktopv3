name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: macos-14
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-2022
            args: ""
          - platform: windows-11-arm
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.platform }}-${{ matrix.args }}"

      # --- FIX FOR WINDOWS ARM64 ORT CRATE BUG ---
      # Downloads the official Microsoft ARM64 release and bypasses the broken Pyke.io CDN package
      - name: Workaround ORT Windows ARM64 Bug
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $ORT_VERSION = "1.17.1"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-arm64-$ORT_VERSION.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "C:\onnxruntime"
          
          # Force the ort crate to use this local, correct ARM64 library
          "ORT_STRATEGY=system" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_LIB_LOCATION=C:\onnxruntime\onnxruntime-win-arm64-$ORT_VERSION\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          # Pre-emptively copy the DLL to the build output so Tauri successfully bundles it
          New-Item -ItemType Directory -Force -Path "target\release"
          Copy-Item "C:\onnxruntime\onnxruntime-win-arm64-$ORT_VERSION\lib\onnxruntime.dll" -Destination "target\release\"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          tagName: app-v__VERSION__
          releaseName: App v__VERSION__
          releaseBody: |
            Download the installer for your platform below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
